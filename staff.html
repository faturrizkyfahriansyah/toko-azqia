<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOKOQIA - Staf</title>
<meta name="description" content="TOKOQIA - Area Staf TOKO AZQIA (Pemilik/Pengelola).">
<meta name="theme-color" content="#ffffff">
<!--
  SENGAJA TIDAK ADA <link rel="manifest"> di halaman ini, dan halaman ini TIDAK melakukan
  redirect ke index.html - lihat catatan di frontend/staff.html versi sebelumnya untuk alasan
  lengkapnya (supaya "Tambahkan ke Layar Utama" selalu membuka persis halaman staf ini).
-->
<link rel="icon" href="assets/icons/tokoqia-favicon.png">
<link rel="apple-touch-icon" href="assets/icons/tokoqia-app-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"><div class="content"><div class="spinner"></div></div></div>

<script defer src="js/utils.js"></script>
<script defer src="js/api.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/config.js"></script>
<script defer src="js/cart-state.js"></script>
<script defer src="js/router.js"></script>
<script defer src="js/layout.js"></script>

<script defer src="js/printer/receiptBuilder.js"></script>
<script defer src="js/printer/browserAdapter.js"></script>
<script defer src="js/printer/thermalAdapter.js"></script>
<script defer src="js/printer/serialAdapter.js"></script>
<script defer src="js/printer/localBridgeAdapter.js"></script>
<script defer src="js/printer/printerInterface.js"></script>
<script defer src="js/barcode.js"></script>

<script defer src="internal/login.js"></script>
<script defer src="internal/dashboard.js"></script>
<script defer src="internal/pos.js"></script>
<script defer src="internal/transactions.js"></script>
<script defer src="internal/products.js"></script>
<script defer src="internal/inventory.js"></script>
<script defer src="internal/purchases.js"></script>
<script defer src="internal/suppliers.js"></script>
<script defer src="internal/payables.js"></script>
<script defer src="internal/customers.js"></script>
<script defer src="internal/receivables.js"></script>
<script defer src="internal/orders.js"></script>
<script defer src="internal/cash.js"></script>
<script defer src="internal/expenses.js"></script>
<script defer src="internal/reports.js"></script>
<script defer src="internal/users.js"></script>
<script defer src="internal/settings.js"></script>
<script defer src="internal/promos.js"></script>
<script defer src="internal/messages.js"></script>
<script defer src="internal/profile.js"></script>

<script defer src="shop/home.js"></script>
<script defer src="shop/catalog.js"></script>
<script defer src="shop/cart.js"></script>
<script defer src="shop/checkout.js"></script>
<script defer src="shop/payment.js"></script>
<script defer src="shop/order.js"></script>
<script defer src="shop/tracking.js"></script>

<script>
// Dibungkus DOMContentLoaded karena script module di atas kini memakai "defer" (optimasi
// performa). Urutan eksekusi & routing TETAP SAMA seperti sebelumnya.
document.addEventListener('DOMContentLoaded', function () {
  Router.register('/shop/home', 'shop', Modules.home.render, true);
  Router.register('/shop/catalog', 'shop', Modules.catalog.render, true);
  Router.register('/shop/cart', 'shop', Modules.cart.render, true);
  Router.register('/shop/checkout', 'shop', Modules.checkout.render, true);
  Router.register('/shop/payment', 'shop', Modules.payment.render, true);
  Router.register('/shop/order', 'shop', Modules.order.render, true);
  Router.register('/shop/tracking', 'shop', Modules.tracking.render, true);

  Router.register('/internal/login', 'internal', Modules.login.render, true);
  Router.register('/internal/dashboard', 'internal', Modules.dashboard.render, false);
  Router.register('/internal/pos', 'internal', Modules.pos.render, false);
  Router.register('/internal/transactions', 'internal', Modules.transactions.render, false);
  Router.register('/internal/orders', 'internal', Modules.orders.render, false);
  Router.register('/internal/products', 'internal', Modules.products.render, false);
  Router.register('/internal/purchases', 'internal', Modules.purchases.render, false);
  Router.register('/internal/inventory', 'internal', function (c) { return Modules.inventory.render(c, 'ledger'); }, false);
  Router.register('/internal/opname', 'internal', function (c) { return Modules.inventory.render(c, 'opname'); }, false);
  Router.register('/internal/returns', 'internal', function (c) { return Modules.inventory.render(c, 'retur_customer'); }, false);
  Router.register('/internal/customers', 'internal', Modules.customers.render, false);
  Router.register('/internal/receivables', 'internal', Modules.receivables.render, false);
  Router.register('/internal/suppliers', 'internal', Modules.suppliers.render, false);
  Router.register('/internal/payables', 'internal', Modules.payables.render, false);
  Router.register('/internal/cash', 'internal', Modules.cash.render, false);
  Router.register('/internal/expenses', 'internal', Modules.expenses.render, false);
  Router.register('/internal/reports', 'internal', Modules.reports.render, false);
  Router.register('/internal/users', 'internal', Modules.users.render, false);
  Router.register('/internal/settings', 'internal', function (c) { return Modules.settings.render(c, 'toko'); }, false);
  Router.register('/internal/audit', 'internal', function (c) { return Modules.settings.render(c, 'audit'); }, false);
  Router.register('/internal/backup', 'internal', function (c) { return Modules.settings.render(c, 'backup'); }, false);
  Router.register('/internal/promos', 'internal', Modules.promos.render, false);
  Router.register('/internal/messages', 'internal', Modules.messages.render, false);
  Router.register('/internal/profile', 'internal', Modules.profile.render, false);

  // Beda dengan index.html: default halaman di sini adalah login/ringkasan staf, bukan beranda pembeli.
  if (!location.hash || location.hash === '#/shop/home') {
    location.hash = Auth.isLoggedIn() ? '#/internal/dashboard' : '#/internal/login';
  }

  if (!window.TOKO_AZQIA_CONFIG || !window.TOKO_AZQIA_CONFIG.apiBaseUrl) {
    console.warn('TOKO AZQIA: apiBaseUrl belum diisi di js/config.js - lihat docs/DEPLOYMENT.md TAHAP 11.');
  }
  Router.render();
});
</script>
</body>
</html>
