<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOKO AZKIA</title>
<meta name="description" content="TOKO AZKIA - Melayani Kebutuhan, Membangun Kepercayaan.">
<meta name="theme-color" content="#C8102E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"><div class="content"><div class="spinner"></div></div></div>

<!-- Urutan pemuatan penting: utils/api/auth/config sebelum router; router sebelum layout;
     printer sebelum modul yang memakainya (pos.js); semua modul sebelum skrip init di akhir. -->
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/config.js"></script>
<script src="js/cart-state.js"></script>
<script src="js/router.js"></script>
<script src="js/layout.js"></script>

<script src="js/printer/receiptBuilder.js"></script>
<script src="js/printer/browserAdapter.js"></script>
<script src="js/printer/thermalAdapter.js"></script>
<script src="js/printer/printerInterface.js"></script>

<script src="internal/login.js"></script>
<script src="internal/dashboard.js"></script>
<script src="internal/pos.js"></script>
<script src="internal/products.js"></script>
<script src="internal/inventory.js"></script>
<script src="internal/purchases.js"></script>
<script src="internal/suppliers.js"></script>
<script src="internal/customers.js"></script>
<script src="internal/orders.js"></script>
<script src="internal/reports.js"></script>
<script src="internal/users.js"></script>
<script src="internal/settings.js"></script>

<script src="shop/home.js"></script>
<script src="shop/catalog.js"></script>
<script src="shop/cart.js"></script>
<script src="shop/checkout.js"></script>
<script src="shop/payment.js"></script>
<script src="shop/order.js"></script>
<script src="shop/tracking.js"></script>

<script>
  // Registrasi seluruh route (Bagian 13 - Sitemap UI/UX).
  Router.register('/shop/home', 'shop', Modules.home.render, true);
  Router.register('/shop/catalog', 'shop', Modules.catalog.render, true);
  Router.register('/shop/cart', 'shop', Modules.cart.render, true);
  Router.register('/shop/checkout', 'shop', Modules.checkout.render, true);
  Router.register('/shop/payment', 'shop', Modules.payment.render, true);
  Router.register('/shop/order', 'shop', Modules.order.render, true);
  Router.register('/shop/tracking', 'shop', Modules.tracking.render, true);

  Router.register('/internal/login', 'internal', Modules.login.render, true);
  Router.register('/internal/dashboard', 'internal', Modules.dashboard.render, false);
  Router.register('/internal/pos', 'internal', Modules.pos.render, false);
  Router.register('/internal/products', 'internal', Modules.products.render, false);
  Router.register('/internal/inventory', 'internal', Modules.inventory.render, false);
  Router.register('/internal/purchases', 'internal', Modules.purchases.render, false);
  Router.register('/internal/suppliers', 'internal', Modules.suppliers.render, false);
  Router.register('/internal/customers', 'internal', Modules.customers.render, false);
  Router.register('/internal/orders', 'internal', Modules.orders.render, false);
  Router.register('/internal/reports', 'internal', Modules.reports.render, false);
  Router.register('/internal/users', 'internal', Modules.users.render, false);
  Router.register('/internal/settings', 'internal', Modules.settings.render, false);

  if (!window.TOKO_AZKIA_CONFIG || !window.TOKO_AZKIA_CONFIG.apiBaseUrl) {
    console.warn('TOKO AZKIA: apiBaseUrl belum diisi di js/config.js - lihat docs/DEPLOYMENT.md TAHAP 11.');
  }
  Router.render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
</body>
</html>
